name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================
  # Markdown Lint & Validation
  # ============================================
  docs-lint:
    name: Documentation Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Documentation Files Exist
        run: |
          echo "📚 Verifying documentation structure..."
          EXPECTED_DOCS=33
          ACTUAL_DOCS=$(find docs/ -name "*.md" -type f | wc -l)
          echo "Expected: $EXPECTED_DOCS docs, Found: $ACTUAL_DOCS docs"
          if [ "$ACTUAL_DOCS" -lt "$EXPECTED_DOCS" ]; then
            echo "⚠️ Warning: Expected $EXPECTED_DOCS docs but found $ACTUAL_DOCS"
          else
            echo "✅ All documentation files present"
          fi

      - name: Verify Root Files Exist
        run: |
          echo "📄 Verifying root files..."
          FILES=(
            "README.md"
            "PROJECT_MANIFEST.md"
            "ROADMAP.md"
            "CHANGELOG.md"
            "LICENSE"
            "CLAUDE.md"
            "CODEX.md"
            "AI_STUDIO.md"
            "AGENTS.md"
            ".clinerules"
            ".editorconfig"
            ".gitattributes"
            ".gitignore"
          )
          MISSING=0
          for file in "${FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              MISSING=$((MISSING + 1))
            else
              echo "✅ Found: $file"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "⚠️ $MISSING root file(s) missing"
            exit 1
          fi

