name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================
  # Markdown Lint & Validation
  # ============================================
  docs-lint:
    name: Documentation Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Documentation Files Exist
        run: |
          echo "📚 Verifying documentation structure..."
          EXPECTED_DOCS=33
          ACTUAL_DOCS=$(find docs/ -name "*.md" -type f | wc -l)
          echo "Expected: $EXPECTED_DOCS docs, Found: $ACTUAL_DOCS docs"
          if [ "$ACTUAL_DOCS" -lt "$EXPECTED_DOCS" ]; then
            echo "⚠️ Warning: Expected $EXPECTED_DOCS docs but found $ACTUAL_DOCS"
          else
            echo "✅ All documentation files present"
          fi

      - name: Verify Root Files Exist
        run: |
          echo "📄 Verifying root files..."
          FILES=(
            "README.md"
            "PROJECT_MANIFEST.md"
            "ROADMAP.md"
            "CHANGELOG.md"
            "LICENSE"
            "CLAUDE.md"
            "CODEX.md"
            "AI_STUDIO.md"
            "AGENTS.md"
            ".clinerules"
            ".editorconfig"
            ".gitattributes"
            ".gitignore"
          )
          MISSING=0
          for file in "${FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              MISSING=$((MISSING + 1))
            else
              echo "✅ Found: $file"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "⚠️ $MISSING root file(s) missing"
            exit 1
          fi

  # ============================================
  # PHP Lint & Style Check (Laravel Pint)
  # ============================================
  lint:
    name: Pint Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, mysqlnd, pdo, pdo_mysql
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

  # ============================================
  # Static Analysis (Larastan / PHPStan)
  # ============================================
  static-analysis:
    name: Larastan Level 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, mysqlnd, pdo, pdo_mysql
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  # ============================================
  # Tests (PHPUnit with Coverage)
  # ============================================
  tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, mysqlnd, pdo, pdo_mysql, pdo_sqlite
          coverage: xdebug

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Tests with Coverage
        run: |
          vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
